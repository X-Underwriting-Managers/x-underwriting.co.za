name: Deploy — Test

on:
  push:
    branches:
      - test/main

permissions:
  id-token: write   # Required for OIDC token exchange
  contents: read

jobs:
  deploy:
    name: Sync to S3 (Test)
    runs-on: ubuntu-latest
    environment: Test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write lead API config
        # The landing page calls the Xcelerate lead API from the browser, so the
        # key ends up public in js/lead-config.js; keeping it here keeps it out of git.
        env:
          LEAD_API_BASE: ${{ vars.XCELERATE_BASE_API }}
          LEAD_API_KEY: ${{ secrets.XCELERATE_API_KEY }}
        run: |
          if [ -z "$LEAD_API_BASE" ] || [ -z "$LEAD_API_KEY" ]; then
            echo "::warning::XCELERATE_BASE_API or XCELERATE_API_KEY is not set; broker leads will be emailed instead of sent to the CRM."
          fi
          jq -rn --arg base "$LEAD_API_BASE" --arg key "$LEAD_API_KEY" \
            '"window.XU_LEAD_API = " + ({base: $base, key: $key} | tojson) + ";"' > js/lead-config.js

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync to S3
        run: |
          aws s3 sync . s3://websitetest.x-underwriting.co.za \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude ".gitignore" \
            --exclude "aws/*" \
            --exclude "docs/*"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
