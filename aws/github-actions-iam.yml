AWSTemplateFormatVersion: "2010-09-09"
Description: >
  IAM OIDC provider and deployment roles for GitHub Actions CI/CD.
  Grants test/main branch access to the test S3 bucket and production/main
  branch access to the production S3 bucket. No long-lived credentials needed.

Parameters:
  GitHubOrg:
    Type: String
    Default: X-Underwriting-Managers
  GitHubRepo:
    Type: String
    Default: x-underwriting.co.za
  CloudFrontDistributionIdTest:
    Type: String
    Description: CloudFront distribution ID for the test environment
  CloudFrontDistributionIdProduction:
    Type: String
    Description: CloudFront distribution ID for the production environment
  ExistingOIDCProviderArn:
    Type: String
    Default: ""
    Description: >
      Leave blank to create a new GitHub OIDC provider (first time setup).
      If token.actions.githubusercontent.com already exists in IAM → Identity
      Providers, paste its ARN here (arn:aws:iam::<account-id>:oidc-provider/token.actions.githubusercontent.com)
      to skip creation and avoid a conflict.

Conditions:
  CreateOIDCProvider: !Equals [!Ref ExistingOIDCProviderArn, ""]

Resources:

  # ── OIDC Identity Provider ──────────────────────────────────────────────────
  # Skipped automatically if ExistingOIDCProviderArn is provided above.
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  # ── IAM Role — Test ─────────────────────────────────────────────────────────
  GitHubActionsRoleTest:
    Type: AWS::IAM::Role
    Properties:
      RoleName: github-actions-deploy-test
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOIDCProvider
                - !GetAtt GitHubOIDCProvider.Arn
                - !Ref ExistingOIDCProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub:
                  !Sub "repo:${GitHubOrg}/${GitHubRepo}:environment:test"
      Policies:
        - PolicyName: deploy-test
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: S3SyncTest
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                  - s3:GetObjectAcl
                  - s3:PutObjectAcl
                Resource: arn:aws:s3:::websitetest.x-underwriting.co.za/*
              - Sid: S3ListTest
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource: arn:aws:s3:::websitetest.x-underwriting.co.za
              - Sid: CloudFrontInvalidateTest
                Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                Resource:
                  !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistributionIdTest}"

  # ── IAM Role — Production ───────────────────────────────────────────────────
  GitHubActionsRoleProduction:
    Type: AWS::IAM::Role
    Properties:
      RoleName: github-actions-deploy-production
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOIDCProvider
                - !GetAtt GitHubOIDCProvider.Arn
                - !Ref ExistingOIDCProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub:
                  !Sub "repo:${GitHubOrg}/${GitHubRepo}:environment:production"
      Policies:
        - PolicyName: deploy-production
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: S3SyncProduction
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                  - s3:GetObjectAcl
                  - s3:PutObjectAcl
                Resource: arn:aws:s3:::x-underwriting.co.za/*
              - Sid: S3ListProduction
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource: arn:aws:s3:::x-underwriting.co.za
              - Sid: CloudFrontInvalidateProduction
                Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                Resource:
                  !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistributionIdProduction}"

Outputs:
  RoleArnTest:
    Description: Paste this value into the GitHub 'test' environment secret AWS_ROLE_ARN
    Value: !GetAtt GitHubActionsRoleTest.Arn
  RoleArnProduction:
    Description: Paste this value into the GitHub 'production' environment secret AWS_ROLE_ARN
    Value: !GetAtt GitHubActionsRoleProduction.Arn
  OIDCProviderArn:
    Description: OIDC provider ARN in use (created or existing)
    Value: !If
      - CreateOIDCProvider
      - !GetAtt GitHubOIDCProvider.Arn
      - !Ref ExistingOIDCProviderArn
